[build]
  publish = "."
  functions = "netlify/functions"

# --- API de suscripción (Brevo doble opt-in) ---
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# --- Webhook de eventos transaccionales de Brevo ---
[[redirects]]
  from = "/api/brevo-events"
  to = "/.netlify/functions/brevo-events"
  status = 200

# --- Webhook de Hotmart (compras -> listas de Brevo) ---
[[redirects]]
  from = "/api/hotmart"
  to = "/.netlify/functions/hotmart"
  status = 200

# --- Nombre canónico del lead magnet ---
[[redirects]]
  from = "/recurso-gratuito"
  to = "/guia-gratis"
  status = 301
  force = true

# --- Acceso directo al PDF (enlaces viejos a la carpeta) ---
[[redirects]]
  from = "/descargas/guia-ugc-7k2m9x/"
  to = "/descargas/guia-ugc-7k2m9x/tu-primera-colaboracion-con-un-hotel.pdf"
  status = 301

[[redirects]]
  from = "/descargas/guia-ugc-7k2m9x/tu-primera-colaboracion-ugc-travel.pdf"
  to = "/descargas/guia-ugc-7k2m9x/tu-primera-colaboracion-con-un-hotel.pdf"
  status = 301

# --- Artículos viejos hacia sus reemplazos del clúster ---
[[redirects]]
  from = "/blog-como-empezar"
  to = "/que-es-creador-ugc-de-viajes"
  status = 301
  force = true

[[redirects]]
  from = "/blog-tarifas-ugc"
  to = "/cuanto-cobrar-ugc-viajes"
  status = 301
  force = true

[[redirects]]
  from = "/blog-viajes-pagados"
  to = "/canje-o-pago-creadores"
  status = 301
  force = true

